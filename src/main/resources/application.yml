server:
  port: 8080

spring:
  application:
    name: notes-service

  # Default to H2 for easy runnable demo (zero external dependencies)
  r2dbc:
    url: r2dbc:h2:mem:///notesdb
    username: sa
    password:

  # Uncomment for PostgreSQL (recommended for production)
  # r2dbc:
  #   url: r2dbc:postgresql://localhost:5432/notesdb
  #   username: notes
  #   password: notes

  graphql:
    graphiql:
      enabled: true
      path: /graphiql

  # Schema initialization for R2DBC (runs on startup for H2)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # For Postgres in real env you would use Flyway or Liquibase

logging:
  level:
    com.notetaking: DEBUG
    org.springframework.r2dbc: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Demo configuration - see README for how to pass X-User-Id
notes:
  demo-users:
    - id: 11111111-1111-1111-1111-111111111111
      name: Alice
      email: alice@example.com
    - id: 22222222-2222-2222-2222-222222222222
      name: Bob
      email: bob@example.com
    - id: 33333333-3333-3333-3333-333333333333
      name: Carol
      email: carol@example.com
