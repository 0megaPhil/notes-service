server:
  port: 8080

spring:
  application:
    name: notes-service

  # Default to H2 for easy runnable demo (zero external dependencies)
  r2dbc:
    # Use file-based H2 for reliable visibility of writes across connections/pool in dev/demo
    # (mem:/// can have isolation quirks with R2DBC under load or multiple handlers)
    url: r2dbc:h2:file:///./target/h2/notesdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:

  # Uncomment for PostgreSQL (recommended for production)
  # r2dbc:
  #   url: r2dbc:postgresql://localhost:5432/notesdb
  #   username: notes
  #   password: notes

  graphql:
    path: /graphql
    schema:
      locations:
        - classpath:graphql/**/
    graphiql:
      enabled: true
      path: /graphiql

  webflux:
    static-path-pattern: /static/**

  # Schema initialization for R2DBC (runs on startup for H2)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # For Postgres in real env you would use Flyway or Liquibase

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Demo users (used by DataInitializer and for easy JWT login)
notes:
  demo-users:
    - id: 11111111-1111-1111-1111-111111111111
      name: Alice
      email: alice@example.com
    - id: 22222222-2222-2222-2222-222222222222
      name: Bob
      email: bob@example.com
    - id: 33333333-3333-3333-3333-333333333333
      name: Carol
      email: carol@example.com

# Auth note:
# - Use POST /auth/login with {"userId": "..."} to get a Bearer token
# - Send Authorization: Bearer <token> on GraphQL requests
# - X-User-Id header still works as fallback for GraphiQL / simple testing

# Data seeding control
# Set to true to automatically load demo users/teams/notes on startup.
# This keeps core application logic independent of demo data.
app:
  data:
    seed-demo: false   # Default: no automatic demo data. Use 'demo' profile or set to true for local development.

# Logging configuration (SLF4J + Logback)
logging:
  level:
    com.notetaking.notes: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.graphql: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI / Swagger configuration (documents REST endpoints; GraphQL uses GraphiQL)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Notes Service REST API
    description: |
      REST endpoints for authentication and actuator.
      The primary API is GraphQL at /graphql (use GraphiQL at /graphiql for exploration and the schema).
    version: 0.1.0
  packages-to-scan: com.notetaking.notes.controller, org.springframework.boot.actuate
  paths-to-match: /auth/**, /actuator/**
