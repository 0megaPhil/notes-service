# Development profile with demo data enabled
# Usage: ./mvnw spring-boot:run -Dspring.profiles.active=dev

app:
  data:
    seed-demo: true

spring:
  graphql:
    path: /graphql
    schema:
      locations: classpath:schema.graphqls,classpath:graphql/**/*
  webflux:
    static-path-pattern: /static/**

# You can override other dev-specific settings here
logging:
  level:
    com.notetaking.notes: DEBUG
    org.springframework.r2dbc: DEBUG