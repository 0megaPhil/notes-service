spring:
  r2dbc:
    url: r2dbc:h2:mem:///testdb
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  webflux:
    static-path-pattern: /static/**

# Explicitly disable demo data seeding in tests.
# Core application logic should be testable without any pre-populated data.
app:
  data:
    seed-demo: false
